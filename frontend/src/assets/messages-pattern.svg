<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Messages tab background: SkillSwap motifs (conversation, swapping,
       skills). Used as a CSS mask, so only the shapes matter; the colour
       comes from the theme. Tiles seamlessly at 320×320. -->

  <!-- chat bubbles -->
  <g transform="translate(22 26) rotate(-8)">
    <path d="M6 4h30a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6H18l-8 7v-7H6a6 6 0 0 1-6-6V10a6 6 0 0 1 6-6z"/>
    <path d="M10 14h22M10 21h14"/>
  </g>

  <!-- swap arrows -->
  <g transform="translate(138 30)">
    <path d="M2 10h34l-8-8M38 28H4l8 8"/>
  </g>

  <!-- guitar -->
  <g transform="translate(248 18) rotate(25)">
    <circle cx="11" cy="31" r="9"/>
    <circle cx="21" cy="22" r="6"/>
    <circle cx="12" cy="30" r="2"/>
    <path d="M25 18 39 4M36 1l4 4"/>
  </g>

  <!-- code brackets -->
  <g transform="translate(36 128)">
    <path d="M10 6 2 16l8 10M32 6l8 10-8 10M24 2l-6 28"/>
  </g>

  <!-- SkillSwap star mark -->
  <g transform="translate(136 116) scale(1.7)">
    <path d="M12 2L8 8H4l4 4-2 6 6-3 6 3-2-6 4-4h-4L12 2z"/>
  </g>

  <!-- camera -->
  <g transform="translate(236 128) rotate(-10)">
    <path d="M2 10h8l3-5h14l3 5h8v22H2z"/>
    <circle cx="20" cy="21" r="6"/>
  </g>

  <!-- lightbulb -->
  <g transform="translate(30 232) rotate(10)">
    <path d="M14 2a11 11 0 0 0-7 19.5V27h14v-5.5A11 11 0 0 0 14 2z"/>
    <path d="M9 32h10"/>
  </g>

  <!-- paintbrush -->
  <g transform="translate(130 228)">
    <path d="M34 2 16 20"/>
    <path d="M14 22c-5-1-9 2-9 7 0 2-1 4-3 5 6 1 13-1 14-6 0-3-1-5-2-6z"/>
  </g>

  <!-- open book -->
  <g transform="translate(232 236) rotate(-6)">
    <path d="M2 6c6-3 12-3 18 0v24c-6-3-12-3-18 0zM20 6c6-3 12-3 18 0v24c-6-3-12-3-18 0z"/>
  </g>

  <!-- globe (languages) -->
  <g transform="translate(96 176)">
    <circle cx="14" cy="14" r="12"/>
    <path d="M2 14h24M14 2c4 4 5 8 5 12s-1 8-5 12c-4-4-5-8-5-12s1-8 5-12z"/>
  </g>

  <!-- heart -->
  <g transform="translate(200 186) rotate(12)">
    <path d="M14 26 3 15a6.5 6.5 0 0 1 11-7 6.5 6.5 0 0 1 11 7z"/>
  </g>

  <!-- small sparkles -->
  <path d="M96 84v8M92 88h8"/>
  <path d="M206 92v6M203 95h6"/>
  <path d="M290 212v8M286 216h8"/>
  <path d="M70 300v6M67 303h6"/>
</svg>
